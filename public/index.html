<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek SaaS Starter · Demo</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-2: #111a33;
      --panel: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8ecf4;
      --muted: #8b93a7;
      --accent: #6366f1;
      --accent-2: #22d3ee;
      --danger: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(99, 102, 241, 0.25), transparent 60%),
        radial-gradient(1000px 500px at 0% 110%, rgba(34, 211, 238, 0.15), transparent 60%),
        linear-gradient(160deg, var(--bg), var(--bg-2));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 20px 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center; font-size: 20px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }
    .title { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; }
    .slogan { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .badge {
      margin-left: auto; font-size: 11px; color: var(--muted);
      border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px;
      white-space: nowrap;
    }

    main {
      flex: 1; width: 100%; max-width: 820px; margin: 0 auto;
      display: flex; flex-direction: column; padding: 12px 20px 20px;
    }

    #chat {
      flex: 1; overflow-y: auto; padding: 8px 4px;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }

    .msg { display: flex; }
    .msg-user { justify-content: flex-end; }
    .msg-assistant, .msg-error { justify-content: flex-start; }

    .bubble {
      max-width: 78%; padding: 12px 16px; border-radius: 16px;
      line-height: 1.65; font-size: 15px; word-break: break-word;
      white-space: pre-wrap;
    }
    .msg-user .bubble {
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      border-bottom-right-radius: 4px; box-shadow: 0 6px 18px rgba(99, 102, 241, 0.3);
    }
    .msg-assistant .bubble {
      background: var(--panel); border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg-error .bubble {
      background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
    }

    .msg-assistant .text { display: inline; }
    .cursor {
      display: inline-block; width: 8px; height: 16px; margin-left: 2px;
      background: var(--accent-2); vertical-align: -2px; border-radius: 1px;
      animation: blink 0.9s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .reasoning {
      font-size: 13px; color: var(--muted); margin-bottom: 8px;
      border-left: 2px solid var(--border); padding-left: 10px;
    }
    .reasoning summary { cursor: pointer; font-weight: 600; user-select: none; }
    .reasoning div { margin-top: 6px; white-space: pre-wrap; }

    .usage { font-size: 11px; color: var(--muted); margin-top: 8px; }

    #composer {
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 18px; padding: 10px; margin-top: 14px;
      transition: border-color 0.2s;
    }
    #composer:focus-within { border-color: var(--accent); }
    #input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 15px; resize: none;
      max-height: 160px; line-height: 1.5; padding: 6px 8px; font-family: inherit;
    }
    #sendBtn {
      border: none; cursor: pointer; height: 40px; padding: 0 20px;
      border-radius: 12px; font-size: 14px; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
      transition: transform 0.1s, opacity 0.2s;
    }
    #sendBtn:active { transform: scale(0.96); }
    #sendBtn.stop { background: linear-gradient(135deg, #64748b, #475569); box-shadow: none; }

    footer {
      text-align: center; color: var(--muted); font-size: 12px;
      padding: 14px 20px 22px;
    }
    footer a { color: var(--accent-2); text-decoration: none; }

    @media (max-width: 640px) {
      .bubble { max-width: 92%; }
      .badge { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">🤖</div>
      <div>
        <div class="title">DeepSeek-SaaS-Starter</div>
        <div class="slogan">5 分钟部署你的大模型 SaaS 基座</div>
      </div>
      <span class="badge">Open Source · AGPLv3</span>
    </div>
  </header>

  <main>
    <div id="chat"></div>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行…"></textarea>
      <button id="sendBtn" type="submit">发送</button>
    </form>
  </main>

  <footer>
    由 <a href="#">DeepSeek-SaaS-Starter</a> 驱动 · 数据仅在你的后端与 DeepSeek 之间流转
  </footer>

  <script>
    // ============================================================
    // ⚙️ 部署配置：把下面的地址改成你后端的实际地址
    //   本地开发：http://localhost:3000/api/v1/ai
    //   生产部署：https://你的后端域名/api/v1/ai
    //
    // ⚠️ 混合内容提示：Netlify 等静态托管走 HTTPS，而 localhost 是 HTTP，
    //   浏览器会拦截这种「混合内容」请求。生产环境请：
    //     1. 把后端也部署到 HTTPS；
    //     2. 在后端 .env 的 CORS_ORIGIN 中加入本页面所在域名。
    // ============================================================
    const API_BASE = 'http://localhost:3000/api/v1/ai';

    const chatEl = document.getElementById('chat');
    const formEl = document.getElementById('composer');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');

    // 会话历史（发给后端的完整 messages 数组）
    const history = [];

    // 流式状态
    let streaming = false;
    let controller = null;

    // 打字机缓冲与当前助手气泡引用
    let typeQueue = '';
    let typeTimer = null;
    let assistantText = '';
    let textSpan = null;
    let cursorEl = null;
    let reasoningBox = null;
    let reasoningText = null;
    let currentBubble = null;

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    // HTML 转义，防止大模型输出中的特殊字符破坏页面或注入脚本（XSS 防护）
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
      );
    }

    // 追加一条消息气泡；kind: 'user' | 'assistant' | 'error'
    function appendBubble(kind, html) {
      const row = document.createElement('div');
      row.className = `msg msg-${kind}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (html) bubble.innerHTML = html;
      row.appendChild(bubble);
      chatEl.appendChild(row);
      scrollToBottom();
      return { row, bubble };
    }

    // ---- 打字机效果 ----
    function feedTypewriter(text) {
      typeQueue += text;
      if (!typeTimer) typeTimer = setInterval(drainTypewriter, 12);
    }
    function drainTypewriter() {
      if (!typeQueue) return;
      const chunk = typeQueue.slice(0, 3); // 每 12ms 吐出 3 个字符
      typeQueue = typeQueue.slice(3);
      assistantText += chunk;
      if (textSpan) textSpan.textContent = assistantText;
      scrollToBottom();
      if (!typeQueue) { clearInterval(typeTimer); typeTimer = null; }
    }
    function flushTypewriter() {
      assistantText += typeQueue;
      typeQueue = '';
      if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
      if (textSpan) textSpan.textContent = assistantText;
    }

    // 结束当前流式会话，复位所有状态
    function finishStreaming({ aborted = false, usage = null } = {}) {
      flushTypewriter();
      if (cursorEl) cursorEl.remove();
      if (currentBubble) {
        const meta = document.createElement('div');
        meta.className = 'usage';
        if (usage) {
          meta.textContent =
            `prompt ${usage.prompt_tokens ?? 0} · completion ${usage.completion_tokens ?? 0} · total ${usage.total_tokens ?? 0} tokens`;
        } else if (aborted) {
          meta.textContent = '已停止生成';
        }
        currentBubble.bubble.appendChild(meta);
      }
      if (assistantText) history.push({ role: 'assistant', content: assistantText });

      streaming = false;
      controller = null;
      currentBubble = null; textSpan = null; cursorEl = null;
      reasoningBox = null; reasoningText = null; assistantText = '';
      typeQueue = '';
      sendBtn.textContent = '发送';
      sendBtn.classList.remove('stop');
      inputEl.focus();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || streaming) return;

      // 用户气泡 + 写入历史
      appendBubble('user', escapeHtml(text));
      history.push({ role: 'user', content: text });
      inputEl.value = '';
      inputEl.style.height = 'auto';

      // 助手气泡：思考容器 + 正文 + 光标
      const { bubble } = appendBubble('assistant', '');
      currentBubble = { bubble };

      reasoningBox = document.createElement('details');
      reasoningBox.className = 'reasoning';
      const summary = document.createElement('summary');
      summary.textContent = '思考过程';
      reasoningBox.appendChild(summary);
      reasoningText = document.createElement('div');
      reasoningBox.appendChild(reasoningText);
      bubble.appendChild(reasoningBox);

      const p = document.createElement('p');
      p.className = 'text';
      textSpan = document.createElement('span');
      cursorEl = document.createElement('span');
      cursorEl.className = 'cursor';
      p.appendChild(textSpan);
      p.appendChild(cursorEl);
      bubble.appendChild(p);
      scrollToBottom();

      streaming = true;
      sendBtn.textContent = '停止';
      sendBtn.classList.add('stop');

      try {
        controller = new AbortController();
        const res = await fetch(`${API_BASE}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history, stream: true }),
          signal: controller.signal,
        });

        // 非 2xx：读取后端返回的标准 JSON 错误
        if (!res.ok) {
          const errData = await res.json().catch(() => null);
          const msg = errData?.error?.message || `请求失败（HTTP ${res.status}）`;
          finishStreaming();
          appendBubble('error', escapeHtml(msg));
          return;
        }

        // 解析 SSE 流
        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        let usage = null;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() ?? ''; // 最后一行可能不完整，留到下次

          for (const line of lines) {
            const t = line.trim();
            if (!t.startsWith('data:')) continue;
            const data = t.slice(5).trim();
            if (data === '[DONE]') continue;

            let evt;
            try { evt = JSON.parse(data); } catch { continue; }

            if (evt.type === 'delta') {
              if (evt.reasoning_content) {
                reasoningBox.open = true;
                reasoningText.textContent += evt.reasoning_content;
                scrollToBottom();
              }
              if (evt.content) feedTypewriter(evt.content);
            } else if (evt.type === 'done') {
              usage = evt.usage;
            } else if (evt.type === 'error') {
              throw new Error(evt.message);
            }
          }
        }

        finishStreaming({ usage });
      } catch (err) {
        if (err.name === 'AbortError') {
          finishStreaming({ aborted: true }); // 用户主动停止
        } else {
          finishStreaming();
          appendBubble('error', escapeHtml(err.message || '网络错误，请确认后端已启动'));
        }
      }
    }

    function autoResize() {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    }

    formEl.addEventListener('submit', (e) => {
      e.preventDefault();
      if (streaming) { controller?.abort(); return; } // 正在生成时，按钮充当「停止」
      sendMessage();
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        formEl.requestSubmit();
      }
    });
    inputEl.addEventListener('input', autoResize);

    // 初始欢迎气泡
    appendBubble('assistant', '你好！我是 DeepSeek 演示助手 👋\n输入任意问题，体验流式输出与打字机效果。');
  </script>
</body>
</html>
